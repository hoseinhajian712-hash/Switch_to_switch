<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Switch to Switch | ثبت درخواست</title><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:Tahoma,Arial;color:#172033}.wrap{max-width:920px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:white;border-radius:24px;padding:26px;margin-bottom:15px}.card{background:white;border:1px solid #e5eaf0;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px #0f172a0a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-size:12px;font-weight:bold}input,select,textarea{width:100%;border:1px solid #d8e0ea;border-radius:12px;padding:12px;margin-top:6px;font:inherit;background:#fff}button{border:0;border-radius:12px;padding:12px 16px;font-weight:bold;cursor:pointer}.primary{background:#2563eb;color:#fff;width:100%;margin-top:15px}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.choice{border:1px solid #d8e0ea;background:#fff}.choice.active{outline:3px solid #93c5fd;background:#eff6ff}.hidden{display:none}.notice{padding:13px;border-radius:12px;background:#f8fafc;margin-top:12px;line-height:1.9}.back{color:#dbeafe;text-decoration:none}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="hero"><a class="back" href="index.html">← صفحه اصلی</a><h1>Switch to Switch</h1><p>تخصص ما معاوضه خودروست؛ فروش و خرید ماشین را هم حرفه‌ای انجام می‌دهیم.</p></div><div class="card"><h3>نوع خدمت</h3><div class="choices"><button class="choice active" data-type="sell" onclick="setType('sell')">🚗 فروش ماشین</button><button class="choice" data-type="exchange" onclick="setType('exchange')">🔄 معاوضه خودرو</button><button class="choice" data-type="buy" onclick="setType('buy')">🔎 خرید ماشین</button></div></div><div class="card"><h3>اطلاعات مشتری</h3><div class="grid"><label>نام و نام خانوادگی<input id="name"></label><label>شماره موبایل<input id="mobile" inputmode="tel"></label></div></div><div id="current" class="card"><h3>مشخصات ماشین فعلی</h3><div class="grid"><label>برند<select id="brand" onchange="models()"><option value="">انتخاب برند</option><option>ایران خودرو</option><option>سایپا</option><option>کرمان موتور</option><option>مدیران خودرو</option><option>فونیکس</option><option>بهمن</option></select></label><label>مدل<select id="model" onchange="trims()"></select></label><label>تیپ<select id="trim" onchange="years()"></select></label><label>سال<select id="year"></select></label><label>رنگ<select id="color"><option>سفید</option><option>مشکی</option><option>نقره‌ای</option><option>خاکستری</option><option>آبی</option><option>قرمز</option></select></label><label>کارکرد (کیلومتر)<input id="mileage" inputmode="numeric" oninput="fmt(this)"></label></div></div><div id="target" class="card hidden"><h3>ماشین موردنظر</h3><div class="grid"><label>برند<select id="tbrand" onchange="tmodels()"><option>انتخاب برند</option><option>ایران خودرو</option><option>سایپا</option><option>کرمان موتور</option><option>مدیران خودرو</option><option>فونیکس</option><option>بهمن</option></select></label><label>مدل<select id="tmodel"></select></label><label>بودجه تقریبی<input id="budget" inputmode="numeric" oninput="fmt(this)"></label></div></div><div id="appointment" class="card"><h3>زمان مراجعه</h3><div class="grid"><label>روز<select id="date"></select></label><label>ساعت<select id="time"></select></label></div><div class="notice">ساعت کاری ۹ تا ۱۷. برای خرید ماشین زمان مراجعه لازم نیست.</div></div><div class="card"><label>توضیحات<textarea id="note" rows="3"></textarea></label><button class="primary" onclick="submitCase()">ثبت درخواست</button><div id="msg" class="notice hidden"></div></div></main><script>
const API=SUPABASE_URL+'/functions/v1/switch-to-switch';let type='sell';
const data={'ایران خودرو':['پژو 206','پژو 207','دنا','تارا','سمند'],'سایپا':['کوئیک','ساینا','شاهین','اطلس','تیبا'],'کرمان موتور':['جک S3','جک S5','KMC J7'],'مدیران خودرو':['X22','X33','X55'],'فونیکس':['FX','Tiggo 7','Tiggo 8'],'بهمن':['فیدلیتی','دیگنیتی','رسپکت']};
function setType(t){type=t;document.querySelectorAll('.choice').forEach(function(x){x.classList.toggle('active',x.dataset.type===t)});document.getElementById('current').classList.toggle('hidden',t==='buy');document.getElementById('target').classList.toggle('hidden',t!=='exchange');document.getElementById('appointment').classList.toggle('hidden',t==='buy')}
function fill(el,a){el.innerHTML='';a.forEach(function(x){let o=document.createElement('option');o.textContent=x;o.value=x;el.appendChild(o)})}
function models(){fill(document.getElementById('model'),data[document.getElementById('brand').value]||['انتخاب مدل']);trims()}
function trims(){let m=document.getElementById('model').value;let a=m==='پژو 206'?['تیپ ۲','تیپ ۵','SD']:m==='پژو 207'?['دنده‌ای','اتوماتیک']:m==='شاهین'?['G','اتوماتیک']:['استاندارد'];fill(document.getElementById('trim'),a);years()}
function years(){let max=document.getElementById('model').value==='پژو 206'&&document.getElementById('trim').value==='تیپ ۵'?1399:1405;let a=[];for(let y=1405;y>=1385;y--)if(y<=max)a.push(String(y));fill(document.getElementById('year'),a)}
function tmodels(){fill(document.getElementById('tmodel'),data[document.getElementById('tbrand').value]||['انتخاب مدل'])}
function fmt(i){i.value=i.value.replace(/\D/g,'').replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function initDates(){for(let i=0;i<21;i++){let d=new Date();d.setHours(12);d.setDate(d.getDate()+i);let o=document.createElement('option');o.value=d.toISOString().slice(0,10);o.textContent=new Intl.DateTimeFormat('fa-IR',{weekday:'long',month:'long',day:'numeric'}).format(d);date.appendChild(o)}for(let m=540;m<=1020;m+=30){let o=document.createElement('option');o.value=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');o.textContent=o.value;time.appendChild(o)}}
async function submitCase(){let name=document.getElementById('name').value.trim(),mobile=document.getElementById('mobile').value.trim();if(!name||!mobile)return show('نام و موبایل را وارد کن.');let vehicle=type==='buy'?null:{brand:brand.value,model:model.value,trim:trim.value,model_year:Number(year.value),color:color.value,mileage:Number(mileage.value.replace(/,/g,''))||0};let targetVehicle=type==='exchange'?{brand:tbrand.value,model:tmodel.value,budget:Number(budget.value.replace(/,/g,''))||0}:null;let body={name:name,mobile:mobile,type:type,notes:note.value,appointment_date:type==='buy'?null:date.value,appointment_time:type==='buy'?null:time.value,vehicle:vehicle,target_vehicle:targetVehicle};try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();if(!r.ok||j.error)throw new Error(j.error||'خطا در ثبت درخواست');show('✅ درخواست ثبت شد. کد پرونده: '+(j.case_number||j.case&&j.case.case_number||'ثبت شد'))}catch(e){show('❌ '+e.message)}}
function show(t){msg.classList.remove('hidden');msg.textContent=t}
initDates();models();tmodels();setType(new URLSearchParams(location.search).get('type')||'sell');
</script></body></html>
