<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رزرو نوبت | سوییچ به سوییچ</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;background:#f4f6f8;font-family:Tahoma,Arial;color:#17202a}.wrap{max-width:700px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#111827,#263449);color:white;border-radius:22px;padding:25px;margin-bottom:15px}.card{background:white;border:1px solid #e5eaf0;border-radius:18px;padding:18px;box-shadow:0 8px 24px #0f172a0d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;font-weight:bold}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #d9e0e7;border-radius:12px;padding:12px;margin-top:6px;font:inherit;background:white}button{border:0;border-radius:12px;padding:12px 16px;font-weight:bold;cursor:pointer}.primary{background:#2563eb;color:white;width:100%;margin-top:15px}.slot{padding:10px;border:1px solid #d9e0e7;background:white;border-radius:10px}.slot:disabled{opacity:.45}.notice{padding:12px;border-radius:12px;background:#f8fafc;margin-top:10px;font-size:12px;line-height:1.8}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="hero"><h2>SWITCH TO SWITCH</h2><div>رزرو نوبت فروش / معاوضه خودرو</div><small>ساعت کاری: ۹ صبح تا ۵ عصر</small></div><div class="card"><h3>ثبت نوبت</h3><div class="grid"><label>نام و نام خانوادگی<input id="name" placeholder="مثلاً علی رضایی"></label><label>شماره موبایل<input id="mobile" inputmode="tel" placeholder="09xxxxxxxxx"></label><label>نوع درخواست<select id="type"><option value="sell">فروش خودرو</option><option value="exchange">معاوضه خودرو</option></select></label><label>تاریخ مراجعه<select id="date"></select></label></div><div style="margin-top:14px"><label>ساعت مراجعه</label><div id="slots" class="grid" style="margin-top:7px"></div></div><label style="display:block;margin-top:12px">توضیحات<textarea id="note" rows="3" placeholder="اختیاری"></textarea></label><button class="primary" onclick="book()">ثبت نوبت</button><div id="msg" class="notice" style="display:none"></div></div></div><script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let selectedTime='';
function faDate(d){return new Intl.DateTimeFormat('fa-IR',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(d)}
function iso(d){return d.toISOString().slice(0,10)}
function makeDates(){const s=document.getElementById('date');s.innerHTML='';for(let i=0;i<21;i++){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+i);const o=document.createElement('option');o.value=iso(d);o.textContent=faDate(d);s.appendChild(o)}renderSlots();}
async function renderSlots(){const date=document.getElementById('date').value;const {data}=await sb.rpc('get_taken_appointment_slots',{p_date:date});const taken=new Set((data||[]).map(x=>String(x.appointment_time).slice(0,5)));const box=document.getElementById('slots');box.innerHTML='';selectedTime='';for(let m=9*60;m<=17*60;m+=30){const h=String(Math.floor(m/60)).padStart(2,'0'),mi=String(m%60).padStart(2,'0'),t=`${h}:${mi}`;const b=document.createElement('button');b.className='slot';b.textContent=t;b.disabled=taken.has(t);b.onclick=()=>{selectedTime=t;document.querySelectorAll('.slot').forEach(x=>x.style.outline='');b.style.outline='3px solid #2563eb'};box.appendChild(b)}}
document.getElementById('date').onchange=renderSlots;
async function book(){const name=document.getElementById('name').value.trim(),mobile=document.getElementById('mobile').value.trim(),type=document.getElementById('type').value,date=document.getElementById('date').value,note=document.getElementById('note').value.trim();if(!name||!mobile||!selectedTime)return show('نام، موبایل و ساعت را کامل انتخاب کنید.');const {error}=await sb.from('cases').insert({customer_name:name,customer_mobile:mobile,service_type:type,status:'new',appointment_date:date,appointment_time:selectedTime,appointment_status:'requested',notes:note||null});if(error){if(error.code==='23505')return show('این ساعت همین الان توسط شخص دیگری رزرو شد؛ لطفاً یک ساعت دیگر انتخاب کنید.');return show(error.message)}show('✅ نوبت شما ثبت شد. درخواست برای پنل مدیریت ارسال شد.');document.getElementById('name').value='';document.getElementById('mobile').value='';document.getElementById('note').value='';selectedTime='';renderSlots()}
function show(t){const m=document.getElementById('msg');m.style.display='block';m.textContent=t}
makeDates();
</script></body></html>
