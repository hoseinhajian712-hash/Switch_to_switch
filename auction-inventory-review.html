<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قیمت‌گذاری خودروهای نمایشگاه‌داران | سوییچ به سوییچ</title><script src="./config.js?v=11"></script><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#173252 0,transparent 38%),#07111f;color:#eef5ff;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:22px}.hero,.card,.vehicle{border:1px solid #29415b;border-radius:18px;background:linear-gradient(155deg,#10243a,#0a1727);padding:18px}.hero{background:linear-gradient(115deg,#183653,#10233a);margin-bottom:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted{color:#9aadc4;font-size:12px;line-height:1.9}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.vehicle{background:#0a192a}.vehicle h3{font-size:16px;margin:0 0 10px}.btn{border:1px solid #3b526b;border-radius:10px;padding:10px 13px;color:#f3f7fc;background:#1b3048;cursor:pointer}.good{background:#123c35;color:#a7f3d0}.bad{background:#401e2b;color:#fecdd3}.tag{display:inline-block;border-radius:99px;padding:5px 9px;font-size:11px;background:#3b3020;color:#f4d99e}.approved{background:#12392f;color:#9be7c7}.rejected{background:#401e2b;color:#fecdd3}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-size:12px;color:#b7c8dc}.field select,.field textarea{width:100%;border:1px solid #304760;background:#081523;color:#edf5ff;padding:11px;border-radius:10px}.photos{display:flex;gap:7px;flex-wrap:wrap}.photos img{width:90px;height:70px;object-fit:cover;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.message{padding:12px;color:#f4d99e}@media(max-width:760px){.wrap{padding:10px}.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><div class="row"><div><h1>صف بررسی موجودی نمایشگاه‌داران</h1><div class="muted">بررسی قیمت پیشنهادی نمایشگاه‌دار و تأیید آن برای اعلام به مشتری؛ خودروها وارد مزایده نمی‌شوند.</div></div><a class="btn" href="./team-panels.html">بازگشت به پنل پرسنل</a></div></section><div id="message" class="message">در حال دریافت اطلاعات…</div><section id="items" class="grid"></section></main><script>
const API=(window.SUPABASE_URL||"").replace(/\/$/,"")+"/functions/v1/dealer-portal",token=sessionStorage.getItem("s2s_team_token")||"";let items=[],cases=[];
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function call(method="GET",body=null){const r=await fetch(API+"?api=review",{method,headers:{"content-type":"application/json",authorization:"Bearer "+token},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"دریافت اطلاعات ناموفق بود.");return d}
function label(s){return ({pending:"در انتظار بررسی",approved:"تأیید قیمت برای اعلام به مشتری",rejected:"رد / نیازمند اصلاح"})[s]||s||"—"}
function render(){const root=document.getElementById("items");if(!items.length){root.innerHTML='<div class="card muted">موجودی ارسالی برای بررسی وجود ندارد.</div>';return}root.innerHTML=items.map(x=>{const d=x.dealer||{};return '<article class="vehicle" data-id="'+esc(x.id)+'"><div class="row"><h3>'+esc(x.brand)+' '+esc(x.model)+' '+esc(x.trim||'')+'</h3><span class="tag '+esc(x.review_status||'pending')+'">'+esc(label(x.review_status))+'</span></div><p class="muted">نمایشگاه: '+esc(d.name||'نمایشگاه')+' · مسئول: '+esc(d.contact_name||'—')+' · موبایل: '+esc(d.mobile||'—')+' · شهر: '+esc(d.city||'—')+'</p><p>سال: '+esc(x.model_year||'—')+' · رنگ: '+esc(x.color||'—')+' · کارکرد: '+esc(x.mileage||'—')+' کیلومتر</p><p><strong>'+Number(x.price||x.approximate_price||0).toLocaleString('fa-IR')+' تومان</strong></p><div class="muted">فنی: '+esc(x.technical_condition||'—')+' · بدنه: '+esc(x.body_condition||'—')+'</div><p class="muted">'+esc(x.notes||'')+'</p><div class="photos">'+(x.photo_urls||[]).map(u=>'<a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" alt="عکس خودرو"></a>').join('')+'</div><div class="field"><label>یادداشت بررسی</label><textarea class="note" rows="2" placeholder="علت رد یا توضیح بررسی">'+esc(x.review_note||'')+'</textarea></div><div class="actions"><button class="btn good approve">تأیید قیمت برای اعلام به مشتری</button><button class="btn bad reject">رد / نیازمند اصلاح</button></div></article>'}).join('')}
document.getElementById("items").addEventListener("click",async e=>{const btn=e.target.closest("button");if(!btn)return;const card=btn.closest("[data-id]"),action=btn.classList.contains("approve")?"approve":btn.classList.contains("reject")?"reject":"";if(!action)return;try{await call("POST",{id:card.dataset.id,action,note:card.querySelector(".note").value,case_id:card.querySelector(".case").value});document.getElementById("message").textContent="تغییر وضعیت ثبت شد.";await load()}catch(err){document.getElementById("message").textContent=err.message}});
async function load(){if(!token){document.getElementById("message").innerHTML='ابتدا در <a style="color:#d6b477" href="./team-panels.html">پنل پرسنل</a> با حساب مدیریت وارد شوید و این صفحه را از همان پنل باز کنید.';return}try{const d=await call();items=d.items||[];document.getElementById("message").textContent="کل خودروها: "+items.length.toLocaleString("fa-IR")+" · در انتظار بررسی: "+items.filter(x=>x.review_status==="pending").length.toLocaleString("fa-IR");render()}catch(e){document.getElementById("message").textContent=e.message}}
load();
</script></main></body></html>
