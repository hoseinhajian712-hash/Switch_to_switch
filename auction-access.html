<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود به مزایده | سوییچ به سوییچ</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#050b14,#0b1930);color:#eef5ff;font-family:Tahoma,Arial}.wrap{max-width:560px;margin:auto;padding:24px}.card{margin-top:8vh;background:#0d1a2b;border:1px solid #203956;border-radius:26px;padding:28px;box-shadow:0 25px 70px #0007}.logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center;font-weight:900;margin-bottom:18px}h1{font-size:24px;margin:0 0 10px}.sub{color:#93a7be;font-size:12px;line-height:2}.notice{margin:15px 0;padding:12px;border-radius:13px;background:#102d45;border:1px solid #255478;color:#c9e3fa;font-size:12px}.err{background:#35151b;border-color:#6d2836;color:#fecdd3}.row{display:grid;gap:9px;margin-top:13px}input{width:100%;background:#081321;color:#fff;border:1px solid #29405c;border-radius:12px;padding:13px;font:inherit;font-size:12px;outline:none}button,a.btn{display:block;width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;background:#2563eb;color:#fff;font:inherit;font-size:12px;font-weight:900;text-align:center;text-decoration:none;cursor:pointer}.secondary{background:#12304e!important}.hidden{display:none}</style><link rel="stylesheet" href="s2s-style.css"></head>
<body><main class="wrap"><section class="card"><div class="logo">S2S</div><h1>🔐 ورود امن به مزایده</h1><div class="sub">نام و شماره موبایل را ثبت کنید. کد تأیید برای ورود استفاده می‌شود و روی صفحه نمایش داده نمی‌شود.</div><div id="msg" class="notice">پس از ثبت شماره، کد تأیید را وارد کنید.</div>
<div id="step1"><div class="row"><input id="name" placeholder="نام و نام خانوادگی"><input id="mobile" inputmode="tel" placeholder="شماره موبایل (مثلاً 0912...)"></div><button onclick="sendCode()">دریافت کد ورود</button></div>
<div id="step2" class="hidden"><div class="row"><input id="code" inputmode="numeric" maxlength="6" placeholder="کد ۶ رقمی"></div><button onclick="verifyCode()">تأیید کد و ورود</button><button class="secondary" onclick="location.reload()">تغییر شماره</button></div>
</section></main>
<script>const API=(window.SUPABASE_URL||'https://avvgbxvfrjrmbuvrymnh.supabase.co')+'/functions/v1/switch-to-switch';const $=id=>document.getElementById(id);function msg(t,e=false){$('msg').textContent=t;$('msg').className='notice'+(e?' err':'')}async function call(api,body){const r=await fetch(API+'?api='+api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'خطا');return j}
async function sendCode(){const mobile=$('mobile').value.trim(),name=$('name').value.trim();try{msg('در حال ساخت کد ورود...');const j=await call('auction-request-code',{mobile,full_name:name});$('step1').classList.add('hidden');$('step2').classList.remove('hidden');msg('✅ کد تأیید ارسال/آماده شد؛ کد را وارد کنید.')}catch(e){msg('❌ '+e.message,true)}}
async function verifyCode(){try{msg('در حال بررسی کد...');const j=await call('auction-verify-code',{mobile:$('mobile').value.trim(),code:$('code').value.trim()});if(j.token){localStorage.setItem('s2s_auction_token',j.token);location.href='auction.html'}else msg('ورود انجام نشد؛ دوباره تلاش کنید.',true)}catch(e){msg('❌ '+e.message,true)}}</script></body></html>
