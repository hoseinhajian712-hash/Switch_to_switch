<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل کارشناس V4</title><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:Tahoma;color:#172033}.wrap{max-width:1100px;margin:auto;padding:18px}.top{background:#111827;color:#fff;padding:22px;border-radius:22px}.card{background:#fff;border:1px solid #e5eaf0;border-radius:18px;padding:18px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}input,select,textarea{width:100%;padding:11px;border:1px solid #d8e0ea;border-radius:11px;margin-top:6px;font:inherit}label{font-size:12px;font-weight:bold}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.check{padding:12px;border:1px solid #d8e0ea;border-radius:12px}.defects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.defect{border:1px solid #e5eaf0;padding:12px;border-radius:14px}.defect select{margin-top:8px}button{background:#2563eb;color:#fff;border:0;padding:12px 18px;border-radius:12px;font-weight:bold;margin-top:14px}.muted{color:#64748b;font-size:12px}@media(max-width:750px){.grid,.defects{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid,.defects,.checks{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><h2>پنل کارشناسی V4</h2><div>ثبت سریع مشخصات، مدارک و ایرادات خودرو</div></div><div class="card"><label>کد پرونده<input id="caseId" placeholder="کد یا شناسه پرونده"></label><button onclick="loadCase()">دریافت پرونده</button><div id="caseInfo" class="muted"></div></div><div class="card"><h3>اطلاعات شناسایی خودرو</h3><div class="grid"><label>VIN<input id="vin"></label><label>شماره موتور<input id="engine"></label><label>پلاک<input id="plate"></label></div></div><div class="card"><h3>چک‌لیست سریع</h3><div class="checks"><label class="check">سوییچ یدک دارد؟ <input id="spare" type="checkbox"></label><label class="check">کارت سوخت دارد؟ <input id="fuel" type="checkbox"></label><label class="check">وکالت‌نامه دارد؟ <input id="poa" type="checkbox"></label><label class="check">عکس کارت ملی مالک <input id="national" type="file" accept="image/*" capture="environment"></label></div></div><div class="card"><h3>ایرادات کارشناسی</h3><div id="defs" class="defects"></div><label style="display:block;margin-top:12px">جمع‌بندی<textarea id="summary" rows="4"></textarea></label><button onclick="saveInspection()">ثبت پایان کارشناسی</button><div id="msg" class="muted"></div></div></main><script>
const API=SUPABASE_URL+'/functions/v1/switch-to-switch',KEY='S2S-V4-2026-EXPERT';const parts=['سقف','کاپوت','درب‌ها','گلگیرها','سپرها','آینه‌ها','چراغ‌ها','صندوق','شاسی','تعلیق','کولر و تهویه','موتور','گیربکس'];const opts=['سالم','تعویض','برش و تعویض','صافکاری بدون رنگ','صافکاری نقاشی','لیسه بدون بتونه','لیسه با بتونه','رنگ‌پریدگی','ضربه'];let current=null;
parts.forEach(function(p,i){let d=document.createElement('div');d.className='defect';d.innerHTML='<b>'+p+'</b><select id="d'+i+'">'+opts.map(function(o){return '<option>'+o+'</option>'}).join('')+'</select>';defs.appendChild(d)});
async function loadCase(){let id=caseId.value.trim();if(!id)return;let r=await fetch(API+'?key='+KEY+'&api=list');let j=await r.json();let a=j.cases||j||[];current=a.find(function(x){return String(x.id)===id||String(x.case_number)===id});caseInfo.textContent=current?'پرونده '+(current.case_number||current.id)+' • '+(current.customer_name||''):'پرونده پیدا نشد'}
function readFile(f){return new Promise(function(res,rej){let r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(f)})}
async function saveInspection(){if(!current)return msg.textContent='ابتدا پرونده را دریافت کنید.';if(!vin.value||!engine.value||!plate.value)return msg.textContent='VIN، شماره موتور و پلاک الزامی است.';if(!national.files[0])return msg.textContent='عکس کارت ملی مالک الزامی است.';let defects=[];parts.forEach(function(p,i){let v=document.getElementById('d'+i).value;if(v!=='سالم')defects.push({part:p,defect_type:v})});let b={vin:vin.value,engine_number:engine.value,plate_number:plate.value,spare_key:spare.checked,fuel_card:fuel.checked,power_of_attorney:poa.checked,summary:summary.value,defects:defects,national_id_data_url:await readFile(national.files[0])};let r=await fetch(API+'?key='+KEY+'&api=inspect&id='+current.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let j=await r.json();msg.textContent=r.ok?'✅ کارشناسی ثبت شد و مدارک ذخیره شدند.':'❌ '+(j.error||'خطا')}
let p=new URLSearchParams(location.search).get('case');if(p){caseId.value=p;loadCase()}
</script></body></html>
