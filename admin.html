<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت V4</title><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;font-family:Tahoma;color:#172033}.wrap{max-width:1200px;margin:auto;padding:18px}.top{background:linear-gradient(135deg,#0f172a,#1e40af);color:#fff;padding:24px;border-radius:22px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}.stat,.case,.toolbar{background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:14px}.stat b{display:block;font-size:25px;margin-top:6px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:11px;border:1px solid #d7dee8;border-radius:10px;font:inherit}.case{margin-top:10px}.casehead{display:flex;justify-content:space-between;gap:10px}.badge{padding:6px 9px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:bold}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;padding:9px 12px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}.danger{background:#dc2626}.expert{background:#7c3aed}.auction{background:#059669}.muted{font-size:12px;color:#64748b;line-height:1.9}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.casehead{flex-direction:column}}</style></head><body><main class="wrap"><header class="top"><h2>داشبورد مدیریت V4</h2><div>پرونده‌ها • کارشناسی • مزایده • مدارک • انتقال</div></header><section class="stats"><div class="stat">کل<b id="total">0</b></div><div class="stat">جدید<b id="newc">0</b></div><div class="stat">کارشناسی<b id="review">0</b></div><div class="stat">مزایده<b id="auc">0</b></div><div class="stat">تکمیل<b id="done">0</b></div></section><div class="toolbar"><input id="q" placeholder="جستجو کد، نام، موبایل..." oninput="render()"><select id="filter" onchange="render()"><option value="">همه وضعیت‌ها</option><option value="new">جدید</option><option value="review">در انتظار بررسی</option><option value="auction">مزایده</option><option value="auction-end">پایان مزایده</option><option value="documents">تکمیل مدارک</option><option value="contract">قرارداد و انتقال</option><option value="completed">تکمیل شده</option><option value="cancelled">انصراف</option></select><a href="expert.html"><button class="expert">پنل کارشناس</button></a><a href="auction.html"><button class="auction">پنل مزایده</button></a></div><section id="list"></section></main><script>
const API=SUPABASE_URL+'/functions/v1/switch-to-switch',KEY='S2S-V4-2026-ADMIN';let rows=[];
async function load(){let r=await fetch(API+'?key='+KEY+'&api=list');let j=await r.json();rows=j.cases||j||[];document.getElementById('total').textContent=rows.length;document.getElementById('newc').textContent=rows.filter(x=>x.status==='new').length;document.getElementById('review').textContent=rows.filter(x=>x.status==='review').length;document.getElementById('auc').textContent=rows.filter(x=>x.status==='auction').length;document.getElementById('done').textContent=rows.filter(x=>x.status==='completed').length;render()}
function render(){let q=document.getElementById('q').value.trim().toLowerCase(),f=document.getElementById('filter').value;let a=rows.filter(x=>(!f||x.status===f)&&(!q||String(x.case_number||'').includes(q)||String(x.customer_name||'').toLowerCase().includes(q)||String(x.customer_mobile||'').includes(q)));document.getElementById('list').innerHTML=a.map(function(x){return '<article class="case"><div class="casehead"><div><b>پرونده #'+(x.case_number||x.id)+'</b><div class="muted">'+(x.customer_name||'')+' • '+(x.customer_mobile||'')+' • '+(x.service_type||'')+'</div></div><span class="badge">'+(x.status||'new')+'</span></div><div class="muted">ثبت: '+new Date(x.created_at||Date.now()).toLocaleString('fa-IR')+(x.appointment_date?' • مراجعه: '+x.appointment_date+' '+(x.appointment_time||''):'')+'</div><div class="actions">'+(x.status!=='cancelled'&&x.status!=='completed'?'<button onclick="next(\\''+x.id+'\\')">مرحله بعد ←</button>':'')+(x.status==='new'?'<button class="expert" onclick="location.href=\\'expert.html?case=\\'+encodeURIComponent(x.id)">ارجاع به کارشناس</button>':'')+(x.status==='auction'?'<button class="auction" onclick="location.href=\\'auction.html\\'">مزایده</button>':'')+(x.status!=='cancelled'&&x.status!=='completed'?'<button class="danger" onclick="cancelCase(\\''+x.id+'\\')">انصراف</button>':'')+'</div></article>'}).join('')||'<div class="case">پرونده‌ای پیدا نشد.</div>'}
async function next(id){let r=await fetch(API+'?key='+KEY+'&api=next&id='+encodeURIComponent(id),{method:'POST'});if(!r.ok)alert('خطا');load()}async function cancelCase(id){if(!confirm('پرونده انصراف داده شود؟'))return;let r=await fetch(API+'?key='+KEY+'&api=cancel&id='+encodeURIComponent(id),{method:'POST'});if(!r.ok)alert('خطا');load()}load();setInterval(load,5000);
</script></body></html>
