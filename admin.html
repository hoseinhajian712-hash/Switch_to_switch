<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | سوییچ به سوییچ</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;background:#f4f6f8;font-family:Tahoma,Arial;color:#17202a}.wrap{max-width:1200px;margin:auto;padding:20px}.top{background:#111827;color:white;padding:18px;border-radius:18px;margin-bottom:15px}.card{background:white;border:1px solid #e5eaf0;border-radius:16px;padding:15px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f8fafc;border-radius:12px;padding:13px}.stat b{font-size:22px;display:block}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid #e5eaf0;border-radius:12px;padding:12px;margin:8px 0}.badge{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:bold}.yellow{background:#fff6db;color:#a16207}.green{background:#e8f7ee;color:#15803d}.red{background:#feecec;color:#b91c1c}button{border:0;border-radius:9px;padding:9px 12px;font-weight:bold;cursor:pointer}.confirm{background:#16a34a;color:white}.cancel{background:#dc2626;color:white}.muted{color:#718096;font-size:11px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><h2>پنل مدیریت — SWITCH TO SWITCH</h2><div id="who">در حال بررسی ورود...</div></div><div id="login" class="card"><h3>ورود مدیر</h3><input id="email" placeholder="ایمیل" style="padding:11px;width:100%;box-sizing:border-box;margin-bottom:8px"><input id="pass" type="password" placeholder="رمز عبور" style="padding:11px;width:100%;box-sizing:border-box"><button onclick="doLogin()" style="margin-top:8px">ورود</button><div class="muted" style="margin-top:8px">همان حساب Supabase که برای مدیریت استفاده می‌کنی.</div></div><div id="app" style="display:none"><div class="grid"><div class="stat">نوبت‌های درخواستی<b id="requested">0</b></div><div class="stat">تأییدشده<b id="confirmed">0</b></div><div class="stat">لغوشده<b id="cancelled">0</b></div><div class="stat">کل پرونده‌ها<b id="total">0</b></div></div><div class="card"><h3>نوبت‌های مشتریان</h3><div id="list">در حال دریافت...</div></div></div></div><script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let rows=[];
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){document.getElementById('login').style.display='block';document.getElementById('app').style.display='none';document.getElementById('who').textContent='وارد نشده';return}document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('who').textContent='ورود: '+user.email;const {data,error}=await sb.from('cases').select('*').not('appointment_date','is',null).order('appointment_date',{ascending:true}).order('appointment_time',{ascending:true});if(error){document.getElementById('list').textContent=error.message;return}rows=data||[];document.getElementById('requested').textContent=rows.filter(x=>x.appointment_status==='requested').length;document.getElementById('confirmed').textContent=rows.filter(x=>x.appointment_status==='confirmed').length;document.getElementById('cancelled').textContent=rows.filter(x=>x.appointment_status==='cancelled').length;const all=await sb.from('cases').select('id',{count:'exact',head:true});document.getElementById('total').textContent=all.count||0;document.getElementById('list').innerHTML=rows.map(r=>`<div class="row"><div><b>${r.customer_name||'بدون نام'}</b><div class="muted">${r.customer_mobile||''} • ${r.service_type||''}</div><div style="margin-top:5px">📅 ${new Date(r.appointment_date+'T12:00:00').toLocaleDateString('fa-IR')} • ⏰ ${String(r.appointment_time||'').slice(0,5)}</div><div class="muted">${r.notes||''}</div></div><div><span class="badge ${r.appointment_status==='confirmed'?'green':r.appointment_status==='cancelled'?'red':'yellow'}">${r.appointment_status==='confirmed'?'تأیید شده':r.appointment_status==='cancelled'?'لغو شده':'درخواست جدید'}</span>${r.appointment_status==='requested'?`<div style="margin-top:8px"><button class="confirm" onclick="setStatus('${r.id}','confirmed')">تأیید نوبت</button> <button class="cancel" onclick="setStatus('${r.id}','cancelled')">لغو</button></div>`:''}</div></div>`).join('')||'<div class="muted">نوبتی ثبت نشده است.</div>'}
async function setStatus(id,status){const {error}=await sb.from('cases').update({appointment_status:status}).eq('id',id);if(error)return alert(error.message);load()}
async function doLogin(){const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('pass').value});if(error)return alert(error.message);load()}
sb.auth.onAuthStateChange(()=>load());load();setInterval(load,5000);
</script></body></html>
