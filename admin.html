<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت V4</title>
<script src="config.js?v=8"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;font-family:Tahoma;color:#172033}.wrap{max-width:1200px;margin:auto;padding:18px}
.top{background:linear-gradient(135deg,#0f172a,#1e40af);color:#fff;padding:24px;border-radius:22px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}.stat,.case,.toolbar{background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:14px}.stat b{display:block;font-size:25px;margin-top:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:11px;border:1px solid #d7dee8;border-radius:10px;font:inherit}
.case{margin-top:10px}.casehead{display:flex;justify-content:space-between;gap:10px}.badge{padding:6px 9px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:bold}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;padding:9px 12px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}.danger{background:#dc2626}.expert{background:#7c3aed}.auction{background:#059669}.refresh{background:#334155}
.muted{font-size:12px;color:#64748b;line-height:1.9}.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;padding:10px;border-radius:12px;margin-top:12px}.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:10px;border-radius:12px;margin-top:12px}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.casehead{flex-direction:column}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><h2>داشبورد مدیریت V4</h2><div>پرونده‌ها • کارشناسی • مزایده • مدارک • انتقال</div></header>
<div id="message"></div>
<section class="stats">
<div class="stat">کل<b id="total">0</b></div><div class="stat">جدید<b id="newc">0</b></div><div class="stat">کارشناسی<b id="review">0</b></div><div class="stat">مزایده<b id="auc">0</b></div><div class="stat">تکمیل<b id="done">0</b></div>
</section>
<div class="toolbar">
<input id="q" placeholder="جستجو کد، نام، موبایل..." oninput="render()">
<select id="filter" onchange="render()">
<option value="">همه وضعیت‌ها</option><option value="new">درخواست جدید</option><option value="refer">ارجاع به کارشناس</option><option value="inspection">در حال کارشناسی</option><option value="review">پایان کارشناسی</option><option value="auction-ready">آماده مزایده</option><option value="auction">مزایده فعال</option><option value="auction-end">پایان مزایده</option><option value="customer">اعلام قیمت به مشتری</option><option value="docs">تکمیل مدارک</option><option value="contract">قرارداد و انتقال</option><option value="done">معامله تکمیل شد</option><option value="cancelled">انصراف</option>
</select>
<button class="refresh" onclick="load()">↻ بروزرسانی</button>
<a href="expert.html"><button class="expert">پنل کارشناس</button></a><a href="auction.html"><button class="auction">پنل مزایده</button></a>
</div>
<section id="list"></section>
</main>
<script>
const API=SUPABASE_URL+'/functions/v1/switch-to-switch',KEY='S2S-V4-2026-ADMIN';
let rows=[],statusFa={};
function show(type,msg){document.getElementById('message').innerHTML='<div class="'+type+'">'+msg+'</div>'}
async function load(){
 try{
  show('ok','در حال دریافت پرونده‌ها...');
  const r=await fetch(API+'?key='+encodeURIComponent(KEY)+'&api=list&_='+Date.now(),{cache:'no-store'});
  const raw=await r.text(); let j; try{j=JSON.parse(raw)}catch(e){throw new Error('پاسخ نامعتبر از سرور دریافت شد')}
  if(!r.ok||j.error)throw new Error(j.error||('خطای سرور: '+r.status));
  rows=Array.isArray(j.cases)?j.cases:[]; statusFa=j.statusFa||{};
  document.getElementById('total').textContent=rows.length;
  document.getElementById('newc').textContent=rows.filter(x=>x.status==='new'||!x.status).length;
  document.getElementById('review').textContent=rows.filter(x=>['inspection','review'].includes(x.status)).length;
  document.getElementById('auc').textContent=rows.filter(x=>['auction-ready','auction','auction-end'].includes(x.status)).length;
  document.getElementById('done').textContent=rows.filter(x=>x.status==='done').length;
  show('ok','✓ '+rows.length+' پرونده از سرور دریافت شد.');
  render();
 }catch(e){show('err','❌ '+e.message);document.getElementById('list').innerHTML='<div class="case">پرونده‌ها قابل دریافت نیستند. دکمه «بروزرسانی» را بزنید.</div>'}
}
function render(){
 const q=document.getElementById('q').value.trim().toLowerCase(),f=document.getElementById('filter').value;
 const a=rows.filter(x=>(!f||((x.status||'new')===f))&&(!q||String(x.case_number||'').includes(q)||String(x.customer_name||'').toLowerCase().includes(q)||String(x.customer_mobile||'').includes(q)));
 document.getElementById('list').innerHTML=a.map(x=>{
  const st=x.status||'new',label=statusFa[st]||st;
  return '<article class="case"><div class="casehead"><div><b>پرونده #'+(x.case_number||'—')+'</b><div class="muted">'+(x.customer_name||'')+' • '+(x.customer_mobile||'')+' • '+(x.service_type||'')+'</div></div><span class="badge">'+label+'</span></div><div class="muted">ثبت: '+(x.created_at?new Date(x.created_at).toLocaleString('fa-IR'):'—')+(x.appointment_date?' • مراجعه: '+x.appointment_date+' '+(x.appointment_time||''):'')+'</div><div class="actions">'+(st!=='cancelled'&&st!=='done'?'<button onclick="nextCase(\''+x.id+'\')">مرحله بعد ←</button>':'')+(st==='new'?'<button class="expert" onclick="goExpert(\''+x.id+'\')">ارجاع به کارشناس</button>':'')+(st==='auction'?'<button class="auction" onclick="location.href=\'auction.html\'">مزایده</button>':'')+(st!=='cancelled'&&st!=='done'?'<button class="danger" onclick="cancelCase(\''+x.id+'\')">انصراف</button>':'')+'</div></article>'
 }).join('')||'<div class="case">پرونده‌ای پیدا نشد.</div>';
}
function goExpert(id){location.href='expert.html?case='+encodeURIComponent(id)}
async function nextCase(id){try{const r=await fetch(API+'?key='+KEY+'&api=next&id='+encodeURIComponent(id),{method:'POST'});const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||'خطا');await load()}catch(e){show('err','❌ '+e.message)}}
async function cancelCase(id){if(!confirm('پرونده انصراف داده شود؟'))return;try{const r=await fetch(API+'?key='+KEY+'&api=cancel&id='+encodeURIComponent(id),{method:'POST'});const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||'خطا');await load()}catch(e){show('err','❌ '+e.message)}}
load();setInterval(load,15000);
</script>
</body></html>
