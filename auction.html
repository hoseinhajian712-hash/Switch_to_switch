<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مزایده | Switch to Switch</title><script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e8eef8;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#111c33,#31205f 55%,#0e7490);border:1px solid #263654;border-radius:26px;padding:28px;box-shadow:0 20px 60px #0005}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:#c7d2e5}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.nav a{color:#fff;text-decoration:none;background:#ffffff16;border:1px solid #ffffff25;padding:10px 14px;border-radius:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat,.card{background:#0d192a;border:1px solid #20304a;border-radius:20px;padding:18px}.stat small{color:#91a4bd}.stat b{display:block;font-size:27px;margin-top:8px}.card h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:12px}.field label{display:block;color:#9fb0c7;font-size:12px;margin-bottom:7px}.field select,.field input{width:100%;padding:13px;border-radius:12px;border:1px solid #2b3d59;background:#081322;color:#fff;font:inherit}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:bold;cursor:pointer;background:#2563eb;color:#fff}.btn.green{background:#059669}.btn.red{background:#dc2626}.msg{margin-top:12px;color:#a7f3d0}.auction{background:#0a1626;border:1px solid #243752;border-radius:18px;padding:17px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.badge{padding:6px 10px;border-radius:999px;background:#123c35;color:#8ff0c8;font-size:12px}.price{font-size:25px;font-weight:900;margin:10px 0}.muted{color:#8ea1bb;font-size:12px}.bid{display:flex;justify-content:space-between;border-top:1px solid #20304a;padding:9px 0}.empty{text-align:center;color:#8295ae;padding:25px}.danger{color:#fca5a5}@media(max-width:750px){.grid,.stats{grid-template-columns:1fr}.hero h1{font-size:22px}}
</style></head><body><main class="wrap">
<section class="hero"><h1>🔨 پنل مدیریت مزایده</h1><p>ایجاد مزایده برای پرونده‌های پایان کارشناسی، کنترل مزایده‌های فعال و ثبت نتیجه نهایی.</p><div class="nav"><a href="admin.html">← پنل مدیریت</a><a href="expert.html">پنل کارشناسی</a></div></section>
<section class="stats"><div class="stat"><small>آماده مزایده</small><b id="ready">0</b></div><div class="stat"><small>مزایده فعال</small><b id="active">0</b></div><div class="stat"><small>پایان‌یافته</small><b id="ended">0</b></div></section>
<section class="card"><h2>➕ ایجاد مزایده جدید</h2><div class="grid"><div class="field"><label>پرونده پایان کارشناسی</label><select id="caseSelect"><option value="">در حال دریافت پرونده‌ها...</option></select></div><div class="field"><label>قیمت شروع (تومان)</label><input id="start" inputmode="numeric" placeholder="مثلاً 850000000"></div><div class="field"><label>مدت مزایده (دقیقه)</label><input id="duration" type="number" value="60" min="1"></div></div><button class="btn green" style="margin-top:14px" onclick="createAuction()">🚀 شروع مزایده</button><div id="msg" class="msg"></div></section>
<section class="card"><h2>📋 مزایده‌ها</h2><div id="list"><div class="empty">در حال دریافت...</div></div></section>
</main><script>
const API=SUPABASE_URL+'/functions/v1/switch-to-switch',KEY='S2S-V4-2026-ADMIN';
const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('fa-IR');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function api(path,opt={}){const r=await fetch(API+'?key='+encodeURIComponent(KEY)+'&'+path,{cache:'no-store',...opt});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'خطا');return j}
async function loadReady(){const j=await api('api=eligible-auctions');const cs=j.cases||[];caseSelect.innerHTML=cs.length?'<option value="">انتخاب پرونده...</option>'+cs.map(c=>'<option value="'+c.id+'">پرونده '+esc(c.case_number)+' • '+esc(c.customer_name||'')+'</option>').join(''):'<option value="">پرونده آماده‌ای نیست</option>';ready.textContent=cs.length}
async function load(){try{const j=await api('api=auctions');const as=j.auctions||[];active.textContent=as.filter(a=>a.status==='active').length;ended.textContent=as.filter(a=>a.status!=='active').length;list.innerHTML=as.length?as.map(a=>{const c=a.case||{};const bids=a.bids||[];const activeNow=a.status==='active';return '<article class="auction"><div class="row"><div><b>پرونده '+esc(c.case_number||a.case_id)+'</b><div class="muted">'+esc(c.customer_name||'')+'</div></div><span class="badge">'+(activeNow?'مزایده فعال':'پایان‌یافته')+'</span></div><div class="price">'+money(a.current_bid||a.starting_price)+' تومان</div><div class="muted">شروع: '+esc(a.starts_at||'—')+' • پایان: '+esc(a.ends_at||'—')+' • تعداد پیشنهادها: '+bids.length+'</div>'+(bids.length?'<div style="margin-top:10px">'+bids.slice(0,5).map(b=>'<div class="bid"><span>پیشنهاد</span><b>'+money(b.amount)+' تومان</b></div>').join('')+'</div>':'<div class="muted" style="margin-top:10px">هنوز پیشنهادی ثبت نشده است.</div>')+(activeNow?'<button class="btn red" style="margin-top:12px" onclick="endAuction(\''+a.id+'\')">⏹ پایان مزایده</button>':'<div class="muted" style="margin-top:12px">'+(a.winner_id?'🏆 برنده ثبت شده است':'مزایده بدون برنده پایان یافته')+'</div>')+'</article>'}).join(''):'<div class="empty">هنوز مزایده‌ای ایجاد نشده است.</div>'}catch(e){list.innerHTML='<div class="empty danger">'+esc(e.message)+'</div>'}}
async function createAuction(){try{const id=caseSelect.value,p=Number(start.value.replace(/,/g,'')),mins=Number(duration.value||60);if(!id||!p)return msg.textContent='پرونده و قیمت شروع را انتخاب کنید.';const ends=new Date(Date.now()+mins*60000).toISOString();await api('api=create_auction&id='+encodeURIComponent(id),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({starting_price:p,starts_at:new Date().toISOString(),ends_at:ends})});msg.textContent='✅ مزایده با موفقیت فعال شد.';start.value='';await loadReady();await load()}catch(e){msg.textContent='❌ '+e.message}}
async function endAuction(id){if(!confirm('مزایده پایان داده شود؟'))return;try{const j=await api('api=end_auction&id='+encodeURIComponent(id),{method:'POST'});alert(j.winner_id?'✅ مزایده پایان یافت و برنده ثبت شد.':'مزایده پایان یافت؛ برنده‌ای ثبت نشده است.');await loadReady();await load()}catch(e){alert('❌ '+e.message)}}
loadReady();load();setInterval(()=>{loadReady();load()},5000);
</script></body></html>
