<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مزایده خودرو | سوییچ به سوییچ</title><script src="config.js"></script>
<style>
*{box-sizing:border-box} :root{--bg:#07111f;--panel:#0d1a2b;--panel2:#102033;--line:#1e3047;--text:#eef5ff;--muted:#8fa4bd;--blue:#3b82f6;--green:#10b981;--orange:#f59e0b;--red:#ef4444}
body{margin:0;background:linear-gradient(135deg,#050b14,#091729 48%,#07111f);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.wrap{max-width:1500px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(135deg,#102746,#0b1728);border:1px solid #203956;border-radius:24px;padding:22px 24px;box-shadow:0 18px 55px #0005}
.brand{display:flex;align-items:center;gap:14px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#3b82f6,#7c3aed);display:grid;place-items:center;font-size:23px;font-weight:900;box-shadow:0 10px 30px #3b82f655}
h1{font-size:20px;margin:0 0 5px}.sub{color:var(--muted);font-size:12px}.live{display:flex;align-items:center;gap:7px;background:#102d27;border:1px solid #1e5a4b;color:#9ff3d2;padding:9px 12px;border-radius:12px;font-size:11px;font-weight:900}.live i{width:8px;height:8px;border-radius:50%;background:#10b981;display:inline-block}
.message{margin:14px 0}.notice{padding:11px 14px;border-radius:13px;font-size:12px;background:#0e253b;border:1px solid #1e496d;color:#b9d8f7}.notice.err{background:#35151b;border-color:#6d2836;color:#fecdd3}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.stat{background:linear-gradient(145deg,#0d1a2b,#0a1625);border:1px solid var(--line);border-radius:17px;padding:15px}.stat small{color:var(--muted)}.stat b{display:block;font-size:25px;margin-top:7px}
.auctions{display:flex;flex-direction:column;gap:15px}.auction{background:linear-gradient(145deg,#102033,#0d1a2b);border:1px solid #1d3149;border-radius:20px;padding:18px;box-shadow:0 14px 40px #0003}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.case{font-size:15px;font-weight:900}.vehicle{font-size:18px;font-weight:900;margin-top:5px}.meta{color:var(--muted);font-size:11px;line-height:1.9;margin-top:6px}.badge{padding:6px 9px;border-radius:999px;background:#123c35;color:#8ff0c8;font-size:10px;font-weight:900}
.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-top:15px}.box{background:#081522;border:1px solid #203851;border-radius:15px;padding:13px}.box-title{font-size:12px;font-weight:900;margin-bottom:9px}.report{font-size:11px;color:#b7c7d9;line-height:2}.report b{color:#eef5ff}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.photos img{width:100%;height:105px;object-fit:cover;border-radius:10px;display:block}.defect{padding:7px 0;border-bottom:1px solid #14273b;font-size:10px;color:#b6c6d8}.defect:last-child{border-bottom:0}.pricebox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.current{background:linear-gradient(135deg,#102f45,#123a35);border:1px solid #28586a;border-radius:14px;padding:13px}.current small{color:#9fb5c9}.price{font-size:25px;font-weight:900;margin-top:6px}.end{font-size:11px;color:#fbbf24;margin-top:6px}
.bidbox{margin-top:12px;background:#0b1828;border:1px solid #263e58;border-radius:15px;padding:13px}.bidtitle{font-size:12px;font-weight:900;margin-bottom:9px}.bid-options{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.bid-option{border:1px solid #28506b;border-radius:11px;padding:12px 8px;font:inherit;font-size:11px;font-weight:900;cursor:pointer;color:#fff;background:#12304b}.bid-option:hover{border-color:#3b82f6;background:#163c5d}.bid-option.primary{background:#059669;border-color:#10b981}.bid-option:disabled{opacity:.5;cursor:not-allowed}.btn{border:0;border-radius:11px;padding:11px 15px;font:inherit;font-size:11px;font-weight:900;cursor:pointer;color:#fff;background:#059669}.btn:disabled{opacity:.5;cursor:not-allowed}.bids{margin-top:12px;max-height:260px;overflow:auto}.bid{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #1c3045;padding:9px 2px;font-size:10px}.bid:first-child{border-top:0}.bid strong{font-size:13px}.bid .who{color:#9fb2c8}.empty{border:1px dashed #263e58;border-radius:15px;padding:28px;text-align:center;color:#647b95;font-size:11px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.photos{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.wrap{padding:10px}.top{padding:17px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.bid-options{grid-template-columns:1fr 1fr}.photos{grid-template-columns:repeat(2,1fr)}}
.ready-panel{margin:15px 0;background:linear-gradient(145deg,#102033,#0d1a2b);border:1px solid #2b4059;border-radius:20px;padding:16px}.ready-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.ready-title{font-size:14px;font-weight:900}.ready-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.ready-card{background:#081522;border:1px solid #203851;border-radius:14px;padding:13px}.ready-card b{font-size:13px}.ready-meta{color:#8fa4bd;font-size:10px;line-height:1.9;margin:6px 0}.manager{display:flex;gap:7px;flex-wrap:wrap}.ready-empty{color:#7188a1;font-size:11px;padding:14px;text-align:center;border:1px dashed #263e58;border-radius:12px;grid-column:1/-1}.btn.blue{background:#2563eb}.btn.orange{background:#b45309}@media(max-width:700px){.ready-list{grid-template-columns:1fr}}/* Professional auction dashboard */body{background:radial-gradient(ellipse at 8% 0%,#12325a 0,transparent 36%),radial-gradient(ellipse at 100% 25%,#12352f 0,transparent 28%),#060e19}.wrap{max-width:1440px;padding:24px}.top{position:relative;overflow:hidden;background:linear-gradient(120deg,#102b4a,#0d1b2d 58%,#102b2c);border-color:#2b4967;padding:25px 28px}.top:after{content:"";position:absolute;width:250px;height:250px;border:1px solid #ffffff0d;border-radius:50%;left:-70px;top:-130px;box-shadow:0 0 0 30px #ffffff05,0 0 0 60px #ffffff03;pointer-events:none}.logo{width:56px;height:56px;border-radius:18px;font-size:20px;letter-spacing:-1px}h1{font-size:22px;letter-spacing:-.3px}.sub{line-height:1.9}.live{padding:10px 14px;box-shadow:0 0 22px #10b98112}.live i{box-shadow:0 0 0 5px #10b98120}.gatebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:15px 0}#gate{margin:0;flex:1}.refresh-pill{font-size:10px;color:#a9bfd6;border:1px solid #233b55;background:#0b1a2a;border-radius:11px;padding:10px 13px}.stats{gap:14px;margin:16px 0 20px}.stat{position:relative;overflow:hidden;padding:18px 19px;border-radius:18px;background:linear-gradient(145deg,#102239,#0b1726);box-shadow:0 12px 28px #0002}.stat:after{content:"";position:absolute;width:75px;height:75px;border-radius:50%;left:-24px;bottom:-40px;background:#3b82f612}.stat small{font-size:11px}.stat b{font-size:28px;letter-spacing:-.5px}.toolbar-auctions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px;padding:12px;background:#0b1828;border:1px solid #1d3047;border-radius:15px}.toolbar-auctions input,.toolbar-auctions select{min-width:0;flex:1;width:auto}.toolbar-auctions input{min-width:220px}.toolbar-label{font-size:11px;font-weight:900;color:#d7e6f7;white-space:nowrap}.auction{border-radius:22px;padding:20px;border-color:#263e57;box-shadow:0 18px 45px #00025;transition:transform .18s,border-color .18s}.auction:hover{border-color:#365b7e;transform:translateY(-1px)}.case{color:#a9c8ed;font-size:12px}.vehicle{font-size:20px;letter-spacing:-.3px}.badge{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border:1px solid #1c6654}.pricebox{gap:12px}.current{border-radius:16px;padding:16px;background:linear-gradient(135deg,#102b42,#10352f);border-color:#285568}.current small{font-size:10px}.price{font-size:clamp(20px,2.5vw,28px);letter-spacing:-.5px}.end{font-size:12px;font-weight:900}.box,.bidbox{border-radius:16px;border-color:#243b54;padding:15px}.box-title,.bidtitle{font-size:12px}.bid-options{gap:9px}.bid-option{border-radius:12px;padding:13px 8px;transition:background .15s,border-color .15s,transform .15s}.bid-option:hover{transform:translateY(-1px)}.bid-option.primary{background:linear-gradient(135deg,#059669,#047857)}.bids{max-height:300px}.bid{padding:11px 3px}.bid strong{color:#d9fbe9}.empty{background:#0b1828;border-color:#2b415a;padding:34px 18px;line-height:2}.countdown{display:inline-flex;align-items:center;gap:8px;margin-top:9px;padding:8px 11px;border-radius:10px;background:#0a3a31;border:1px solid #1d6554;color:#a7f3d0;font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}.countdown.urgent{background:#421c25;border-color:#71313d;color:#fecdd3}.countdown small{font-size:9px;font-weight:700}@media(max-width:700px){.wrap{padding:11px}.top{padding:18px;border-radius:18px}.logo{width:46px;height:46px}.vehicle{font-size:17px}.auction{padding:13px}.pricebox{grid-template-columns:1fr 1fr}.current{padding:12px}.toolbar-auctions input{min-width:100%}.stats .stat{padding:13px}.stat b{font-size:23px}}</style><link rel="stylesheet" href="s2s-style.css"></head>
<body><main class="wrap">
<header class="top"><div class="brand"><div class="logo">S2S</div><div><h1>🔨 مزایده خودرو</h1><div class="sub">خودروهای کارشناسی‌شده • مزایده خصوصی • اشتراک اعضا • پیشنهاد قیمت لحظه‌ای</div></div></div><div class="live"><i></i> مزایده زنده</div></header>
<div class="gatebar"><div id="gate" class="notice">در حال بررسی دسترسی...</div><div class="refresh-pill">↻ به‌روزرسانی خودکار هر ۳ ثانیه</div></div><div id="message" class="message"></div>
<section class="stats"><div class="stat"><small>🔨 مزایده‌های فعال</small><b id="active">0</b></div><div class="stat"><small>💰 پیشنهادهای ثبت‌شده</small><b id="bidCount">0</b></div><div class="stat"><small>🟢 وضعیت سامانه</small><b style="color:#6ee7b7">LIVE</b></div></section>
<div class="toolbar-auctions"><span class="toolbar-label">فهرست مزایده‌ها</span><input id="auctionSearch" type="search" placeholder="جست‌وجوی شماره پرونده یا خودرو..." oninput="renderAuctions()"><select id="auctionSort" onchange="renderAuctions()" aria-label="مرتب‌سازی مزایده‌ها"><option value="new">جدیدترین مزایده</option><option value="end">نزدیک‌ترین زمان پایان</option><option value="price">بالاترین قیمت فعلی</option></select></div>
<section id="list" class="auctions"><div class="empty">در حال دریافت مزایده‌های فعال...</div></section>
</main>
<script>
const API=SUPABASE_URL+'/functions/v1/switch-to-switch';
const $=id=>document.getElementById(id);
const money=n=>Number(n||0).toLocaleString('fa-IR');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function show(msg,err=false){$('message').innerHTML='<div class="notice '+(err?'err':'')+'">'+msg+'</div>'}
async function api(path,opt={}){const r=await fetch(API+'?'+path,{cache:'no-store',...opt});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'خطا');return j}
function fmtTime(v){try{return new Date(v).toLocaleString('fa-IR')}catch(e){return v||'—'}}
function auctionCard(a){
 const v=a.vehicle||{},i=a.inspection||{},bids=a.bids||[],photos=a.photos||[];
 const vehicle=[v.brand,v.model,v.trim].filter(Boolean).join(' ')||'خودرو';
 const next=Math.max(Number(a.current_bid||a.starting_price||0)+1000000,Number(a.current_bid||a.starting_price||0)+1);
 return '<article class="auction"><div class="head"><div><div class="case">پرونده #'+esc(a.case?.case_number||'—')+'</div><div class="vehicle">'+esc(vehicle)+'</div><div class="meta">مدل '+esc(v.model_year||'—')+' · رنگ '+esc(v.color||'—')+' · کارکرد '+(v.mileage?money(v.mileage):'—')+' کیلومتر</div></div><span class="badge">● مزایده فعال</span></div>'+
 '<div class="pricebox"><div class="current"><small>بالاترین قیمت فعلی</small><div class="price">'+money(a.current_bid||a.starting_price)+' تومان</div></div><div class="current"><small>پایان مزایده</small><div class="end">'+fmtTime(a.ends_at)+'</div><div class="meta">قیمت شروع: '+money(a.starting_price)+' تومان</div><div class="countdown" data-countdown="'+esc(a.ends_at)+'">⏳ <span>در حال محاسبه...</span><small>زمان باقی‌مانده</small></div></div></div>'+
 '<div class="grid"><div>'+
 '<div class="box"><div class="box-title">📋 گزارش کارشناسی</div><div class="report">'+esc(i.summary||'گزارش کارشناسی ثبت شده است.')+'<br>شناسه فنی خودرو در این صفحه نمایش داده نمی‌شود.</div></div>'+
 '<div class="box" style="margin-top:10px"><div class="box-title">📷 تصاویر خودرو و کارشناسی</div><div class="photos">'+(photos.length?photos.map(p=>'<a href="'+esc(p.url||'#')+'" target="_blank"><img src="'+esc(p.url||'')+'" alt="'+esc(p.label||'تصویر')+'"></a>').join(''):'<div class="empty">تصویری ثبت نشده</div>')+'</div></div>'+
 '<div class="box" style="margin-top:10px"><div class="box-title">🔎 ایرادات ثبت‌شده</div>'+(a.defects?.length?a.defects.map(d=>'<div class="defect"><b>'+esc(d.part)+'</b> — '+esc(d.defect_type)+(d.explanation?' — '+esc(d.explanation):'')+'</div>').join(''):'<div class="report">ایراد ثبت‌شده‌ای وجود ندارد.</div>')+'</div>'+
 '</div><div>'+
 '<div class="bidbox"><div class="bidtitle">💰 انتخاب پیشنهاد</div><div class="meta" style="margin-bottom:9px">مبلغ را دستی وارد نکنید؛ یکی از پیشنهادهای آماده را انتخاب کنید.</div><div class="bid-options"><button class="bid-option primary" onclick="bid(\''+a.id+'\','+next+')">'+money(next)+' تومان</button><button class="bid-option" onclick="bid(\''+a.id+'\','+(next+2000000)+')">'+money(next+2000000)+' تومان</button><button class="bid-option" onclick="bid(\''+a.id+'\','+(next+5000000)+')">'+money(next+5000000)+' تومان</button><button class="bid-option" onclick="bid(\''+a.id+'\','+(next+10000000)+')">'+money(next+10000000)+' تومان</button></div><div id="bidmsg-'+a.id+'" class="meta"></div></div>'+
 '<div class="box" style="margin-top:10px"><div class="box-title">📈 پیشنهادهای ثبت‌شده</div><div class="bids">'+(bids.length?bids.map((x,n)=>'<div class="bid"><span class="who">'+(n===0?'🏆 ':'')+esc(x.bidder_name||'خریدار')+' · '+fmtTime(x.created_at)+'</span><strong>'+money(x.amount)+' تومان</strong></div>').join(''):'<div class="report">هنوز پیشنهادی ثبت نشده است.</div>')+'</div></div>'+
 '</div></div></article>';
}
let auctionCache=[];function renderAuctions(){const q=($('auctionSearch')?.value||'').trim().toLocaleLowerCase('fa-IR');const sort=$('auctionSort')?.value||'new';let list=[...auctionCache].filter(a=>{const v=a.vehicle||{};const hay=[a.case?.case_number,v.brand,v.model,v.trim,v.model_year].join(' ').toLocaleLowerCase('fa-IR');return !q||hay.includes(q)});list.sort((a,b)=>sort==='end'?new Date(a.ends_at)-new Date(b.ends_at):sort==='price'?Number(b.current_bid||b.starting_price)-Number(a.current_bid||a.starting_price):new Date(b.created_at)-new Date(a.created_at));$('list').innerHTML=list.length?list.map(auctionCard).join(''):'<div class="empty">'+(auctionCache.length?'موردی با این جست‌وجو پیدا نشد.':'در حال حاضر مزایده فعالی وجود ندارد.')+'</div>';} function updateCountdowns(){document.querySelectorAll('[data-countdown]').forEach(el=>{const sec=Math.max(0,Math.ceil((new Date(el.dataset.countdown).getTime()-Date.now())/1000));const span=el.querySelector('span');if(span)span.textContent=sec<=0?'در حال پایان':String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');el.classList.toggle('urgent',sec<=300)})}
async function loadReady(){try{var j=await api("api=public-ready-auctions");var rows=j.cases||[];document.getElementById("readyList").innerHTML=rows.length?rows.map(readyCard).join(""):"<div class=\"ready-empty\">خودروی آماده مزایده‌ای وجود ندارد.</div>"}catch(e){document.getElementById("readyList").innerHTML="<div class=\"ready-empty\">❌ "+esc(e.message)+"</div>";show("❌ "+e.message,true)}}function readyCard(x){var v=x.vehicle||{};var name=[v.brand,v.model,v.trim].filter(Boolean).join(" ")||"خودرو";return "<article class=\"ready-card\"><b>"+esc(name)+"</b><div class=\"ready-meta\">پرونده #"+esc(x.case_number||"—")+" · مدل "+esc(v.model_year||"—")+" · کارکرد "+(v.mileage?money(v.mileage):"—")+" کیلومتر</div><div class=\"meta\">آماده انتقال توسط مدیریت</div></article>"}async function load(){
 try{const t=localStorage.getItem('s2s_auction_token');if(!t){location.href='auction-access.html';return}const j=await api('api=public-auctions&token='+encodeURIComponent(t));$('gate').textContent='✅ دسترسی فعال است';const as=j.auctions||[];auctionCache=as;$('active').textContent=as.length.toLocaleString('fa-IR');$('bidCount').textContent=as.reduce((n,a)=>n+(a.bids||[]).length,0).toLocaleString('fa-IR');renderAuctions()}
 catch(e){if(e.message==='auction_login_required'){localStorage.removeItem('s2s_auction_token');location.href='auction-access.html';return}show('❌ '+e.message,true)}
}
async function bid(id,amount){
 const box=$('bidmsg-'+id),t=localStorage.getItem('s2s_auction_token');
 if(!amount){box.textContent='مبلغ پیشنهاد نامعتبر است.';return}
 try{box.textContent='در حال ثبت پیشنهاد...';await api('api=place-bid&id='+encodeURIComponent(id)+'&token='+encodeURIComponent(t),{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+t},body:JSON.stringify({amount})});show('✅ پیشنهاد شما با موفقیت ثبت شد.');await load()}catch(e){if(e.message==='auction_login_required'){localStorage.removeItem('s2s_auction_token');location.href='auction-access.html'}else box.textContent='❌ '+e.message}}

load();setInterval(load,3000);setInterval(updateCountdowns,1000);
</script></body></html>
