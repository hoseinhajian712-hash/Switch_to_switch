<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مزایده V4 | سوییچ به سوییچ</title><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:Tahoma;color:#172033}.wrap{max-width:1000px;margin:auto;padding:18px}.top{background:linear-gradient(135deg,#111827,#7c3aed);color:#fff;padding:25px;border-radius:22px}.card{background:#fff;border-radius:18px;padding:18px;margin-top:14px;border:1px solid #e5eaf0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}input{width:100%;padding:12px;border:1px solid #d8e0ea;border-radius:11px;margin-top:6px;font:inherit}button{border:0;border-radius:11px;padding:11px 15px;font-weight:bold;background:#2563eb;color:#fff;cursor:pointer;margin-top:10px}.auction{border:1px solid #e5eaf0;border-radius:15px;padding:14px;margin-top:10px}.price{font-size:24px;font-weight:900}.muted{color:#64748b;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><h2>پنل مزایده V4</h2><div>ایجاد مزایده و پایان مزایده پرونده‌ها</div></div><div class="card"><h3>ایجاد مزایده</h3><div class="grid"><label>کد پرونده<input id="caseId"></label><label>قیمت شروع<input id="start" inputmode="numeric"></label><label>مدت به دقیقه<input id="duration" value="60"></label></div><button onclick="createAuction()">ایجاد مزایده</button><div id="msg" class="muted"></div></div><div class="card"><h3>مزایده‌ها</h3><div id="list">در حال دریافت...</div></div></main><script>
const API=SUPABASE_URL+'/functions/v1/switch-to-switch',KEY='S2S-V4-2026-ADMIN';
async function load(){let r=await fetch(API+'?key='+KEY+'&api=auctions');let j=await r.json();let a=j.auctions||j||[];list.innerHTML='';a.forEach(function(x){let d=document.createElement('div');d.className='auction';d.innerHTML='<b>پرونده '+x.case_id+'</b><div class="price">'+Number(x.current_bid||x.starting_price||0).toLocaleString('fa-IR')+' تومان</div><div class="muted">وضعیت: '+x.status+' • پایان: '+(x.ends_at||'—')+'</div>';if(x.status==='active'){let b=document.createElement('button');b.textContent='پایان مزایده';b.onclick=function(){endAuction(x.id)};d.appendChild(b)}list.appendChild(d)});if(!a.length)list.textContent='مزایده‌ای وجود ندارد'}
async function createAuction(){let id=caseId.value.trim(),p=Number(start.value.replace(/,/g,''));if(!id||!p)return msg.textContent='کد پرونده و قیمت شروع را وارد کنید.';let ends=new Date(Date.now()+Number(duration.value||60)*60000).toISOString();let r=await fetch(API+'?key='+KEY+'&api=create_auction',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:id,starting_price:p,starts_at:new Date().toISOString(),ends_at:ends})});let j=await r.json();msg.textContent=r.ok?'✅ مزایده ساخته شد.':'❌ '+(j.error||'خطا');load()}
async function endAuction(id){let r=await fetch(API+'?key='+KEY+'&api=end_auction&id='+id,{method:'POST'});if(!r.ok)alert('خطا در پایان مزایده');load()}load();setInterval(load,5000);
</script></body></html>
